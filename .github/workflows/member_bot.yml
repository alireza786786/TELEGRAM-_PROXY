name: Start Channel Bot Workflow

on:
  push:
    branches:
      - main
  schedule:
    # اجرای خودکار هر ۵ ساعت یک‌بار برای زنده نگه داشتن و چک کردن ربات
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  run-member-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiogram aiosqlite

      - name: Run Member Bot
        env:
          BOT_TOKEN1: ${{ secrets.BOT_TOKEN1 }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python member_bot/bot.py
