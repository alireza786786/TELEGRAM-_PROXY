name: Auto Collect and Publish Proxies

on:
  schedule:
    # بررسی مداوم هر ۴۵ دقیقه یک‌بار
    - cron: '*/45 * * * *'
  workflow_dispatch:

# مجوز نوشتن برای ذخیره تاریخچه در مخزن
permissions:
  contents: write

jobs:
  run-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r proxy_hub/requirements.txt

      - name: Run Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python proxy_hub/main.py

      - name: Save Sent History to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add proxy_hub/sent_proxies.txt || true
          git commit -m "Update sent proxies history [skip ci]" || echo "No new history to commit"
          git push || true
