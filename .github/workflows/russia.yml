name: Russia Configs Pipeline

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: russia-configs-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pytz jdatetime

      - name: Run script
        env:
          PYTHONUNBUFFERED: '1'
          BOT_TOKEN2: ${{ secrets.BOT_TOKEN2 }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SOURCE_1: ${{ secrets.SOURCE_1 }}
        run: python -u russia.py
